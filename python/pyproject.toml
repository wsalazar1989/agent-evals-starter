[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-starter"
version = "0.1.0"
description = "A small LangGraph agent with typed tools, guardrails and an eval harness (no API key needed for tests)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["agent_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
